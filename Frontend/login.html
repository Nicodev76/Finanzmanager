<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/CSS/loginStyle.css" />
  </head>
  <body>
    <header class="login_header">
      <h1 class="login_h1">Login</h1>
      <div>
      <p class="login_h2">gebe sie den benutzernamen ein</p>
      <input class="login_benutzer" type="text"  id="benutzername"/>
      </div>
      <div>
      <p class="login_h2">gebe sie das passwort ein</p>
      <input class="login_passwort" type="password" id="passwort"/>
      </div>
      <button onclick="login()">Login</button>

      <a href="/neueskonto.html">Noch kein Konto?</a>
    </header>

    <script src="/JS/login.js"></script>
  </body>
</html>
