<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinazManager</title>

    <link rel="stylesheet" href="/CSS/css.css" />
  </head>
  <body>
    <div class="top_bar">
      <div class="menu_icon">
        <span class="menu_icon_span"></span>
        <span class="menu_icon_span"></span>
        <span class="menu_icon_span"></span>
      </div>
      <div class="überschrift">Dashboard</div>
      <img src="/icons/glocke.png" width="50px" alt="" />
    </div>

    <div class="main_content">
      <div class = "dashboard_div">
        <div class="dashboard-diagramm">
          <p class="gesamt_übersicht">Gesamt Übersicht</p>

          <h3 class="dashboard_kontostand">0.00 €</h3>
          <p class="dashboard_kontostand_änderung">0.00 € (0.00 %)</p>
        </div>

        <div class="auf_einen_blick">
          <p>Auf einen Blick</p>
        </div>
      </div>

      <div class="analyse_div"> analyse</div>

      <div class="aktien_div">aktien</div>

      <div class="sparen_div">spraen</div>

      <div class="reports_div">reports</div>

      <div class="mehr_div"> mehr</div>

    </div>

    <div class="nav_bar">
      <div class="nav_icon" onclick="nav_home()">
        <img src="/icons/home.png" alt="" />
      </div>

      <div class="nav_icon" onclick="nav_analyse()">
        <img src="/icons/analyse.png" alt="" />
      </div>

      <div class="nav_icon" onclick="nav_aktien()">
        <img src="/icons/aktien.png" alt="" />
      </div>

      <div class="nav_icon" onclick="nav_sparen()">
        <img src="/icons/sparen.png" alt="" />
      </div>

      <div class="nav_icon" onclick="nav_reports()">
        <img src="/icons/reports.png" alt="" />
      </div>

      <div class="nav_icon" onclick="nav_mehr()">
        <img src="/icons/mehr.png" alt="" />
      </div>
    </div>

    <script src="JS/nav.js"></script>
    <script src="JS/dashboard.js"></script>
  </body>
</html>
