  <body>
    <!doctype html>
    <html lang="de">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Regestrieren</title>

        <link rel="stylesheet" href="CSS/login_regestriren.css" />
      </head>
      <body>
        <h1 class="überschrift">Ersttelle ein  ein Koto</h1>
        <div class="benutzername">
          <p>Benutzername</p>
          <input type="text" placeholder="Benutzername" id="benutzernameR"/>
        </div>

        <div class="benutzername">
          <p>Passwort</p>
          <input type="password" placeholder="Passwort" id="passwort1R"/>
        </div>

        <div class="benutzername">
          <p>Password wiederholen</p>
          <input type="password" placeholder="Passwort" id="passwort2R"/>
        </div>
        <button onclick="regestriren()">Registrieren</button>

        <script src="JS/loginRegestriren.js"></script>
      </body>
    </html>
  </body>
