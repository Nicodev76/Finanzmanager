<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neues Konto</title>
    <link rel="stylesheet" href="/CSS/nueskonto.css">
  </head>
  <body>
    <header class="login_header">
      <h1 class="login_h1">Neues Konto</h1>
      <div>
      <p class="login_h2">gebe sie einen benutzernamen ein</p>
      <input id="benutzername" class="login_benutzer" type="text" />
      </div>
      <div>
      <p class="login_h2">gebe sie ein passwort ein</p>
      <input id="passwort1" class="login_passwort" type="password" />
      </div>
      <div>
      <p class="login_h2">gebe sie das passwort erneut ein</p>
      <input id="passwort2" class="login_passwort" type="password" />
      </div>
      <button onclick="neuesKonto()">Registrieren</button>

      <a href="/login.html">Schon ein Konto?</a>
    </header>

    <script src="/JS/login.js"></script>
  </body>
</html>
